[package]
name = "monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
http = "1"
ethers-core = "2.0"
ethers-contract = { version = "2.0", features = ["abigen"] }
ethers-middleware = "2.0"
ethers-providers = { version = "2.0", default-features = false, features = ["rustls"] }
ethers-signers = "2.0"
rand = "0.8"
rust_decimal = "1.35"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "postgres", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
hdrhistogram = "7.5"
smallvec = { version = "1.13", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
jemallocator = "0.5"
jemalloc-ctl = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
